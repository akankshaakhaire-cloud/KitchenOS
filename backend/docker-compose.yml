version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kitchenos-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
    networks:
      - kitchenos-network

  mongodb:
    image: mongo:7
    container_name: kitchenos-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - kitchenos-network

  redis:
    image: redis:7-alpine
    container_name: kitchenos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - kitchenos-network

volumes:
  mongodb-data:
  redis-data:

networks:
  kitchenos-network:
    driver: bridge